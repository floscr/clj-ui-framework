<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./theme.css" />
  <style>
    html, body { margin: 0; padding: 0; }
  </style>
  <script>
    // crypto.randomUUID only exists in secure contexts (HTTPS or localhost).
    // Over a plain-HTTP LAN/Tailscale IP it's undefined, which crashes Eucalypt.
    if (!window.crypto) window.crypto = {};
    if (typeof window.crypto.randomUUID !== 'function') {
      window.crypto.randomUUID = function() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
      };
    }
  </script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var theme = params.get('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.dataset.theme = theme;
      }
      new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          if (mutations[i].attributeName === 'data-theme') {
            var t = document.documentElement.dataset.theme;
            var url = new URL(window.location);
            if (t) url.searchParams.set('theme', t);
            else url.searchParams.delete('theme');
            history.replaceState(null, '', url);
            if (window.parent !== window) {
              window.parent.postMessage({ type: 'theme-change', theme: t || '' }, '*');
            }
          }
        }
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      document.addEventListener('click', function(e) {
        var a = e.target.closest('a[href]');
        if (!a) return;
        try {
          var url = new URL(a.href);
          if (url.hostname === location.hostname && url.port !== location.port) {
            var t = document.documentElement.dataset.theme;
            if (t) url.searchParams.set('theme', t);
            a.href = url.toString();
          }
        } catch (ex) {}
      });
    })();
  </script>
  <script type="module" crossorigin src="./assets/index.js"></script>
</head>
<body>
  <div id="app"></div>
  <script src="./ui-runtime.js"></script>
  <script src="./theme-adapter.js" defer></script>
  <script src="./css-live-reload.js" defer></script>
</body>
</html>
